<section data-markdown>
	<textarea data-template>
		## Real Estate Answers<span class="subtitle"><br>Interlocking markets can explain why cities develop the way they do</span>

		* The Land Market
			- Owners sell land to developers or self-develop (or hold)
		* The Development Market
			- Developers construct new buildings to rent or sell
		* The Occupier Market
			- Businesses rent or buy space for their operational needs
		* The Investment Market
			- Investors acquire buildings for their cashflow
		* The Capital Markets
			- Financial and investment firms provide debt and equity capital
	</textarea>
</section>

<section data-markdown>
	<textarea data-template>
		## Occupier Market <span class="subtitle"><br>Supply and demand for space</span>

		* Firms require space for business
		* Location factor in profitability
		* Supply constrained in short run?
			- Competing firms bid for space
			- The less the space, the higher the rent
		* But rent determines profitability
			- The higher the rent, the less space demanded
			- NB substitution effects
			- Hence demand curve is downward sloping
		* In long run: supply adjusts to demand (more in a bit)

	</textarea>
</section>

<section data-markdown>
	<textarea data-template>
		## The Investment Market <span class="subtitle"><br>Translating net rents to asset prices</span>

		* Investors buy buildings to obtain cashflow
			- The rental income now and in future
		* Investors must give up capital to buy buildings
			- Demand a return on their capital
			- Return reflects cost of capital and risks of cashflow
		* For a freehold property: `$ P = \frac{R}{k}$`
			- P is price, R is rent, k is yield or capitalisation rate
			- As R increases, P rises
			- As k increases, P falls …
	</textarea>
</section>

<section data-markdown>
	<textarea data-template>
		## The Investment Market <span class="subtitle"><br>Translating net rents to asset prices</span>

		* What is k, the Yield or Capitalisation Rate?
			- The income return (this year) on the capital invested: If `$P = \frac{R}{k}$` then `$ k = \frac{R}{P}$`
		* However, rents change over time
			- Investors expect some growth in rents, $g$
		* Investors want to make a return on their capital
			- Required or target rate of return, $r$
			- `$r$` is the Risk Free Rate plus a Risk Premium `$r = RFR + RP$`
		* Freehold Property Capitalisation Rate
			- Cap rate `$k = r – g$`
			- Cap rate `$k = RFR + RP - g$`
		* We need some financial mathematics here … but not this week
	</textarea>
</section>

<section data-markdown>
	<textarea data-template>
		## The Development Market <span class="subtitle"><br>Construction of new assets</span>

		* Developers seek profits
		* They face costs—land and construction costs (or replacement cost RC)
		* Building is profitable when P > RC
			- Need to account for time taken to build
			- Need to account for uncertainty about prices in future
		* There is a minimum P to induce building
		* As P increases, so construction increases

		<span class='source'><mark>But think ahead … what does an increase in supply do to rents, and what does that imply for prices?</mark></span>
	</textarea>
</section>

<section data-markdown>
	<textarea data-template>
		## The Adjustment Market <span class="subtitle"><br>Depreciation and replacement</span>

		* A messy but vital part of the diPasquale-Wheaton Model
		* There is a stock of space $S$
		* New construction increases space $S_1 = S_0 + C$
		* However space is subject to depreciation rate $\delta$
			- Buildings become obsolete due to technological change
			- Old buildings may be too expensive to maintain
			- May need to demolish old buildings to build new ones
		* Hence stock adjustment is `$S_1 = S_0 + C - \delta S_0$`, or `$S_1 = (1-\delta)S_0 + C$`
		* In equilibrium, `$C = \delta S$`

	</textarea>
</section>


<section data-markdown data-background-image="imgs/graskamp.svg" data-background-size="contain">
	<textarea data-template>
		## The Development Process (1)<span class='subtitle'><br>Reaching the development decision</span>
		* Development is inherently multidisciplinary
		* The “Grasskamp Spiral”
		* A use looking for a site?
			- Client business seeking a site
			- Developer with particular specialism
		* A site looking for a use?
			- Economic and political/social factors
			- What is highest and best use for site?
			- What does public authority want?
			- What is permitted on the site?
	</textarea>
</section>


<section data-markdown>
	<textarea data-template>
		## The Development Process (2)<span class="subtitle"><br>Stages in the process (are they strictly sequential?)</span>

		* Feasibility analysis
		* Capital raising (equity, debt)
		* Site assembly
		* Detailed design and planning consents
		* Site clearance and infrastructure
		* Construction phase
		* Finishing, fit out, soft landscaping
		* Marketing and leasing or sale
		* Stabilised operation
		* Obsolescence and redevelopment …
	</textarea>
</section>


<section data-markdown>
	<textarea data-template>
		## The Development Process (3) <span class="subtitle"><br>The Role of the Public Sector & Institutions (finally some policy!)</span>

		* Land use ownership and rights
			- Who owns the land?
			- Who owns the right to determine land use?
			- Is the gain from development “earned” by the landowner?
		* Land Use Planning System
			- Dealing with market failure
			- Ensuring efficiency at the urban / regional scale
			- Ensuring equity at the urban / regional scale
			- Capturing value increases from public expenditure
		* Externalities and Environment
			- What is societal impact of development?
			- How can that be regulated or directed?
	</textarea>
</section>


<section data-markdown data-background-image='imgs/skyline_madrid.jpg'>
	<textarea data-template>
		## <span class='transparent70'> Key Points</span> <span class="subtitle"><br></span>

		* <span class='transparent70'>Built form results from mix of economic and political decisions over time</span>
		* <span class='transparent70'>Outcome is “path dependent” – the existing built form creates inertia, slows adjustment to new urban forms</span>
		* <span class='transparent70'>Series of interlocking markets: Space (Occupier) Market, Investment Market, Development Market, Land Market, Capital Markets … Linkages and feedback</span>
		* <span class='transparent70'>Interaction between these determines outcomes within institutional/regulatory structures</span>
		* <span class='transparent70'>Strong public policy element to operation of markets</span>
	</textarea>
</section>

* I won't go through 500 years of European history, but let me give one more example: Rents collapsed during the siege of Paris in 1590. This was, of course, directly caused by Henry the fourth bombarding the city from the outside.

* But in addition, rents were cut during the first instance of rent regulation that we observe in our sample. This rent regulation regime was short-lived and we basically observe free markets up to WWI.

* Having several centuries unregulated rent data is unique and can really help to come up with counterfactuals for more regulated housing markets.

</textarea>

Notes:

* And this not just a residential real estate story.

* For commercial space we see a similar pattern. This figure gives you the returns for CRE right in the City of London.
The green line shows that very limited long-run capital gains have been achieved since WWII&mdash;in real terms. But the total return was solid due to the income delivered by these properties.

* So, rents are crucial. But our understanding of rents is even worse than our understanding of prices. Giacoletti, Sagi etc. they all work on capital returns but hardly anybody investigates rents.

* That's why I think that a new working paper that I co-authored is so exciting.
